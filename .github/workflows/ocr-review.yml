# OpenCodeReview — automated PR review using GLM-5.3-flash (Zhipu / z-ai).
#
# One repository secret is required, added by you:
#   OCR_LLM_AUTH_TOKEN   your GLM API key
#
# These are already set on the repo via `gh secret set` / `gh variable set`:
#   OCR_LLM_URL              https://api.z.ai/api/coding/paas/v4
#   OCR_LLM_MODEL            glm-5.3-flash
#   OCR_LLM_USE_ANTHROPIC    false
#
# The action and OCR CLI are pinned to v1.13.13 so reruns are reproducible.

name: OpenCodeReview PR Review

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  # Intentional: a collaborator's re-review command cancels an in-flight
  # automatic review for the same PR, so only the newest result is published.
  cancel-in-progress: true

on:
  # pull_request_target keeps the LLM key available for fork PRs. Verified at
  # pin 445ad9d: "Checkout base" uses the trusted base (fetch-depth: 0), PR head
  # blobs are fetched as git objects without materializing PR files, the CLI is
  # installed from npm, and the token is passed via `with:` into env
  # OCR_LLM_TOKEN with `llm.auth_token_cmd` — no PR-controlled code is executed.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only PR events or re-review comments by collaborators can spend quota.
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      # For pull_request_target the action reads base/head from the event
      # payload itself (action.yml: EVENT_BASE_REF / EVENT_HEAD_SHA), so the
      # empty step outputs below are harmless for automatic PR reviews.
      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@445ad9dea3057346986197385858a1a281253cc9 # v1.13.13
        with:
          ocr_version: '1.13.13'
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          llm_reasoning_effort: low
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
